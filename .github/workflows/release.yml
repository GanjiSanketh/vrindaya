name: Release

# Manually triggered only — this workflow builds both apps and creates a
# DRAFT GitHub Release with the build artifacts attached. It deliberately
# does not deploy anywhere or publish the release automatically; a human
# reviews the draft and publishes it (or discards it) explicitly.
#
# Actual deployment remains via angular-build.yml/ci.yml (Vercel) and
# Render's own Git-push watcher — see docs/DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0-beta, v1.1.0)'
        required: true
        default: 'v1.0.0-beta'

jobs:
  build-angular:
    name: Build Angular App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (production)
        run: npm run build

      - name: Package artifact
        run: |
          mkdir -p ../release-artifacts
          tar -czf ../release-artifacts/web-dist-${{ inputs.version }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: release-artifacts/web-dist-${{ inputs.version }}.tar.gz

  build-api:
    name: Build .NET API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: dotnet publish --no-build --configuration Release -o publish

      - name: Package artifact
        run: |
          mkdir -p ../release-artifacts
          tar -czf ../release-artifacts/api-publish-${{ inputs.version }}.tar.gz -C publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: release-artifacts/api-publish-${{ inputs.version }}.tar.gz

  create-draft-release:
    name: Create GitHub Release Draft
    runs-on: ubuntu-latest
    needs: [build-angular, build-api]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: release-artifacts

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: release-artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            release-artifacts/web-dist-${{ inputs.version }}.tar.gz \
            release-artifacts/api-publish-${{ inputs.version }}.tar.gz \
            --draft \
            --title "${{ inputs.version }}" \
            --generate-notes \
            --notes "Draft release for ${{ inputs.version }}. Review the attached build artifacts and the auto-generated notes below, then publish manually. This workflow does not deploy anywhere — see docs/DEPLOYMENT.md for the actual deploy procedures."
