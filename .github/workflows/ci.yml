name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR so pushes don't queue up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — Quality Gate
# Runs on every push and every pull request.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required by SonarCloud for accurate blame and
          # new-code detection (incremental analysis).
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Lint ─────────────────────────────────────────────────────────────
      - name: Lint (ESLint)
        run: npm run lint

      # ── Tests + coverage ──────────────────────────────────────────────────
      # GitHub Actions automatically exports CI=true, which activates the
      # JUnit and verbose reporters defined in vitest.config.ts.
      # Coverage is always enabled (vitest.config.ts: coverage.enabled=true).
      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run tests with coverage
        run: npm run test:ci

      # ── SonarCloud scan ───────────────────────────────────────────────────
      # Required GitHub secrets:
      #   SONAR_TOKEN  →  SonarCloud > My Account > Security > Generate token
      #
      # sonar-project.properties sets sonar.qualitygate.wait=true so this
      # step fails the job when the Quality Gate is red.
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2 — Deploy to Vercel (production)
  # Runs only on push to main AFTER the Quality Gate passes.
  #
  # Required GitHub secrets:
  #   VERCEL_TOKEN       → Vercel > Settings > Tokens > Create
  #   VERCEL_ORG_ID      → .vercel/project.json after running `vercel link`
  #   VERCEL_PROJECT_ID  → same file
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull Vercel project settings so the prebuilt deploy picks up the
      # correct project, team, and environment variable bindings.
      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Deploy the already-built dist/ folder — avoids a second build on Vercel.
      - name: Deploy prebuilt output to Vercel (production)
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Print deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}"
