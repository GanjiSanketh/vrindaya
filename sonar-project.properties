# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud — Vrindaya Angular 21
#
# How to get these values:
#   sonar.projectKey   → SonarCloud > Projects > "Create project manually" → Key
#   sonar.organization → SonarCloud > My Account > Organizations (GitHub login ID)
#   SONAR_TOKEN        → SonarCloud > My Account > Security > Generate token
#                        → add as GitHub secret SONAR_TOKEN
# ─────────────────────────────────────────────────────────────────────────────

# ── Project identification ────────────────────────────────────────────────────
sonar.projectKey=GanjiSanketh_vrindaya
sonar.organization=ganjisanketh
sonar.projectName=Vrindaya
sonar.projectVersion=1.0

# ── Source & test paths ───────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/test-results/**,\
  src/environments/**,\
  **/*.spec.ts

# ── TypeScript / JavaScript ───────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json
# SonarCloud uses its own analysis engine; tsconfigPath points it to your types.

# ── Coverage (LCOV generated by Vitest) ──────────────────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Files excluded from coverage metrics
# (bootstrap, config, and environment files are not meaningfully testable)
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  src/environments/**,\
  src/main.ts,\
  src/main.server.ts,\
  src/app/app.config.ts,\
  src/app/app.config.server.ts,\
  src/app/app.routes.server.ts

# ── Test execution report (JUnit XML from Vitest) ────────────────────────────
sonar.junit.reportPaths=test-results/junit.xml

# ── Duplication exclusions ────────────────────────────────────────────────────
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  src/environments/**

# ── Quality Gate ──────────────────────────────────────────────────────────────
# Makes the GitHub Actions step fail when the Quality Gate fails.
# The gate thresholds themselves are configured in SonarCloud UI:
#   sonarcloud.io > your project > Administration > Quality Gates
#
# Recommended thresholds (set these in SonarCloud):
#   New code:
#     Bugs                 = 0
#     Vulnerabilities      = 0
#     Security Hotspots    = 0
#     Coverage             >= 80%
#     Duplicated lines     < 3%
#     Maintainability Rating = A
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
