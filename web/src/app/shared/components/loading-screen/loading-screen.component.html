@if (visible()) {
  <div class="ls-backdrop" [class.hiding]="hiding()" (click)="dismiss()">

    <div class="ls-content">
      <!-- Decorative ornament -->
      <div class="ls-ornament">
        <span class="ls-line"></span>
        <svg class="ls-lotus" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg" width="28" height="22">
          <path d="M20 4C20 4 11 11 11 20C11 25 14.8 29 20 29C25.2 29 29 25 29 20C29 11 20 4 20 4Z"
                fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M20 10C13 8 7 12 6 18"   fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M20 10C27 8 33 12 34 18"  fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="20" cy="25" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        <span class="ls-line"></span>
      </div>

      <!-- Brand name — letter-by-letter reveal -->
      <h1 class="ls-brand">
        @for (letter of letters; track $index) {
          <span class="ls-letter" [style.animation-delay]="($index * 55) + 'ms'">{{ letter }}</span>
        }
      </h1>

      <!-- Tagline -->
      <p class="ls-tagline">Wear the Grace</p>

      <!-- Gold progress bar -->
      <div class="ls-bar-wrap">
        <div class="ls-bar"></div>
      </div>
    </div>

  </div>
}
