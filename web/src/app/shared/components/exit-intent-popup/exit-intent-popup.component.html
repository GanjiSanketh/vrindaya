@if (svc.shouldShow()) {
  <div class="ei-backdrop" (click)="onBackdropClick($event)" (keydown.escape)="dismiss()" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="ei-title" aria-describedby="ei-message">
    <div class="ei-modal">
      <button class="ei-close" (click)="dismiss()" aria-label="Close popup">
        <i class="bi bi-x-lg"></i>
      </button>
      <div class="ei-body">
        <span class="ei-eyebrow">Wait!</span>
        <h2 class="ei-title" id="ei-title">{{ svc.config().title }}</h2>
        <p class="ei-message" id="ei-message">{{ svc.config().message }}</p>
        <div class="ei-actions">
          <button class="ei-btn ei-btn--primary" (click)="goToNewArrivals()">
            <i class="bi bi-stars"></i> View New Arrivals
          </button>
          <button class="ei-btn ei-btn--ghost" (click)="dismiss()">
            Continue Browsing
          </button>
        </div>
      </div>
    </div>
  </div>
}
