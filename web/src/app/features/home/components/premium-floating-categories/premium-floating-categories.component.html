<section class="pfc-hero" aria-label="Premium categories">

  <div class="pfc-bg" aria-hidden="true">
    <div class="pfc-bg-gradient"></div>
    <div class="pfc-blob pfc-blob-1"></div>
    <div class="pfc-blob pfc-blob-2"></div>
    <div class="pfc-blob pfc-blob-3"></div>

    <svg class="pfc-arch pfc-arch-left" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0 480 C 60 260, 200 150, 480 130 L 480 0 L 0 0 Z" fill="rgba(168,123,78,0.06)" />
      <path d="M0 480 C 70 280, 220 175, 480 165" fill="none" stroke="#a87b4e" stroke-width="1.2" opacity="0.22" />
    </svg>

    <svg class="pfc-arch pfc-arch-right" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M480 480 C 420 260, 280 150, 0 130 L 0 0 L 480 0 Z" fill="rgba(240,230,216,0.35)" />
      <path d="M480 480 C 410 280, 260 175, 0 165" fill="none" stroke="#a87b4e" stroke-width="1.2" opacity="0.18" />
    </svg>

    <svg class="pfc-leaf pfc-leaf-1" viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 2 C 52 22, 56 58, 30 96 C 8 58, 12 22, 30 2 Z" fill="none" stroke="#a87b4e" stroke-width="1.4" />
      <path d="M30 10 C 30 34, 30 60, 30 88" fill="none" stroke="#a87b4e" stroke-width="0.8" />
    </svg>

    <svg class="pfc-leaf pfc-leaf-2" viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 2 C 52 22, 56 58, 30 96 C 8 58, 12 22, 30 2 Z" fill="none" stroke="#a87b4e" stroke-width="1.4" />
      <path d="M30 10 C 30 34, 30 60, 30 88" fill="none" stroke="#a87b4e" stroke-width="0.8" />
    </svg>
  </div>

  <div class="pfc-content container-vr">
    <div class="pfc-intro">
      <h1 class="pfc-heading">Wear the Grace</h1>
      <p class="pfc-sub">Discover timeless ethnic fashion crafted for everyday elegance.</p>
    </div>

    <div class="pfc-grid">
      @if (loading()) {
        @for (_ of [1, 2, 3, 4]; track $index) {
          <div class="pfc-card">
            <div class="pfc-inner pfc-skeleton-card">
              <div class="pfc-media shimmer"></div>
              <div class="pfc-body">
                <div class="skel-line skel-line--name shimmer" style="margin:0.5rem 0 0.4rem;width:70%;"></div>
                <div class="skel-line skel-line--sub shimmer" style="width:50%;"></div>
              </div>
            </div>
          </div>
        }
      } @else {
        @for (c of items(); track c.id; let i = $index) {
          <a
            class="pfc-card"
            [routerLink]="['/category', c.id]"
            [attr.aria-label]="'Shop ' + c.name"
            [style.--stagger]="i"
            [style.--float-duration.s]="floatDurations[i % floatDurations.length]"
            [style.--float-delay.s]="floatDelays[i % floatDelays.length]"
          >
            <div class="pfc-float">
              <div class="pfc-parallax" [style.transform]="parallaxTransform(i)">
                <div class="pfc-inner">
                  <div class="pfc-media">
                    <img [src]="c.image | cloudinaryUrl:600" [srcset]="c.image | cloudinarySrcset"
                         sizes="(max-width: 600px) 50vw, (max-width: 992px) 25vw, 25vw"
                         [alt]="c.name" class="pfc-img" loading="lazy" decoding="async" width="600" height="750" />
                  </div>
                  <div class="pfc-body">
                    <div class="pfc-title">
                      <h2 class="pfc-name">{{ c.name }}</h2>
                      <p class="pfc-subtitle">{{ c.subtitle }}</p>
                    </div>
                    <span class="pfc-arrow" aria-hidden="true">
                      <i class="bi bi-arrow-right"></i>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </a>
        }
      }
    </div>
  </div>

</section>
