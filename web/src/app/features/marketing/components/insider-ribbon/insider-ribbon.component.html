<div
  class="insider-ribbon"
  [class.insider-ribbon--interactive]="svc.ribbonVisible()"
  [@slideUpDown]="animState()"
  role="complementary"
  aria-label="Vrindaya Insider membership offer"
>
  <div class="insider-ribbon__inner">
    <div class="insider-ribbon__copy">
      <span class="insider-ribbon__eyebrow">
        <span class="insider-ribbon__eyebrow-full">✨ Become a Vrindaya Insider</span>
        <span class="insider-ribbon__eyebrow-compact">✨ Vrindaya Insider</span>
      </span>
      <p class="insider-ribbon__desc">
        Early access to new collections, festive launches &amp; exclusive member-only offers.
      </p>
    </div>

    <div class="insider-ribbon__actions">
      <button type="button" class="insider-ribbon__cta" (click)="join()">
        <span class="insider-ribbon__cta-full">Join Insider</span>
        <span class="insider-ribbon__cta-compact">Join</span>
      </button>
      <button type="button" class="insider-ribbon__close" (click)="dismiss()" aria-label="Dismiss">
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>
</div>
