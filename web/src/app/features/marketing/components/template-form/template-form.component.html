<div class="tf-page">

  <div class="tf-header">
    <h1 class="tf-title">{{ isEdit() ? 'Edit Template' : 'New Template' }}</h1>
    <a [routerLink]="BASE" class="tf-back"><i class="bi bi-arrow-left"></i> Back to Templates</a>
  </div>

  @if (loadingTemplate()) {
    <p class="tf-state">Loading template...</p>
  } @else {
    <form class="tf-form" [formGroup]="form" (ngSubmit)="save()">

      <div class="tf-field">
        <label for="tf-name" class="tf-label">Template Name <span class="tf-required">*</span></label>
        <input id="tf-name" type="text" class="form-control" formControlName="name"
               placeholder="e.g. Diwali Sale" [class.invalid]="isInvalid('name')" />
      </div>

      <div class="tf-field">
        <label for="tf-message" class="tf-label">Message <span class="tf-required">*</span></label>
        <div class="tf-placeholders">
          @for (p of placeholders; track p) {
            <button type="button" class="tf-placeholder-btn" (click)="insertPlaceholder(p)">{{ p }}</button>
          }
        </div>
        <textarea
          id="tf-message"
          #messageInput
          class="form-control tf-textarea"
          rows="5"
          formControlName="message"
          [class.invalid]="isInvalid('message')"
        ></textarea>
      </div>

      <div class="tf-field">
        <label for="tf-image" class="tf-label">Image (optional)</label>
        @if (imageUrl()) {
          <div class="tf-image-preview">
            <img [src]="imageUrl()" alt="Template image preview" />
            <button type="button" class="tf-image-remove" (click)="removeImage()" aria-label="Remove image">
              <i class="bi bi-x"></i>
            </button>
          </div>
        } @else {
          <input id="tf-image" type="file" class="form-control" accept="image/*"
                 (change)="onImageSelected($event)" [disabled]="uploadingImage()" />
          @if (uploadingImage()) {
            <span class="tf-hint"><span class="tf-spinner" aria-hidden="true"></span> Uploading…</span>
          }
        }
      </div>

      <div class="tf-field">
        <label for="tf-buttonUrl" class="tf-label">Button URL (optional)</label>
        <input id="tf-buttonUrl" type="url" class="form-control" formControlName="buttonUrl"
               placeholder="https://vrindaya.in/new-arrivals" />
      </div>

      <div class="tf-actions">
        <button type="submit" class="btn-primary" [disabled]="templateSvc.saving()">
          @if (templateSvc.saving()) {
            <span class="tf-spinner" aria-hidden="true"></span> Saving…
          } @else {
            {{ isEdit() ? 'Update Template' : 'Create Template' }}
          }
        </button>
        <a [routerLink]="BASE" class="btn-outline">Cancel</a>
      </div>

    </form>
  }

</div>
