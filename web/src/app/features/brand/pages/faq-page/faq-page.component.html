<main class="bp-page">
  <div class="container-vr">

    <h1 class="bp-heading">Frequently Asked Questions</h1>

    @if (loading()) {
      <p class="bp-loading">Loading…</p>
    } @else if (error()) {
      <div class="bp-empty">
        <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
        <p>{{ error() }}</p>
        <button type="button" class="btn-primary" (click)="load()">Retry</button>
      </div>
    } @else if (faqs().length === 0) {
      <p class="bp-loading">No FAQs yet — check back soon.</p>
    } @else {
      <div class="fq-list">
        @for (faq of faqs(); track faq.id) {
          <div class="fq-item">
            <h2 class="fq-question-wrap">
              <button
                type="button"
                class="fq-question"
                [attr.aria-expanded]="isOpen(faq.id)"
                [attr.aria-controls]="'fq-answer-' + faq.id"
                (click)="toggle(faq.id)">
                <span>{{ faq.question }}</span>
                <i class="bi" [class.bi-chevron-down]="!isOpen(faq.id)" [class.bi-chevron-up]="isOpen(faq.id)" aria-hidden="true"></i>
              </button>
            </h2>
            @if (isOpen(faq.id)) {
              <p class="fq-answer" [id]="'fq-answer-' + faq.id">{{ faq.answer }}</p>
            }
          </div>
        }
      </div>
    }

  </div>
</main>
