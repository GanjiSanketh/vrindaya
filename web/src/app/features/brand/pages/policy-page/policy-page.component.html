<main class="bp-page">
  <div class="container-vr">

    @if (loading()) {
      <p class="bp-loading">Loading…</p>
    } @else if (error()) {
      <div class="bp-empty">
        <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
        <p>{{ error() }}</p>
        <button type="button" class="btn-primary" (click)="retry()">Retry</button>
      </div>
    } @else if (notFound()) {
      <div class="bp-empty">
        <i class="bi bi-file-earmark-x" aria-hidden="true"></i>
        <p class="bp-empty-title">This page doesn't exist</p>
        <a routerLink="/" class="btn-primary">Back to Home</a>
      </div>
    } @else if (policy(); as p) {
      <article class="bp-content">
        <h1 class="bp-heading">{{ p.title }}</h1>
        <p class="bp-body">{{ p.content }}</p>
      </article>
    }

  </div>
</main>
