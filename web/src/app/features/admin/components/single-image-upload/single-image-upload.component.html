<div class="siu-root">
  <label class="siu-label">{{ label() }}</label>

  @if (currentUrl()) {
    <div class="siu-preview">
      <img [src]="currentUrl()" alt="" />
      <button type="button" class="siu-remove" (click)="remove()" title="Remove">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  } @else if (uploading()) {
    <div class="siu-uploading">
      <div class="siu-progress-track"><div class="siu-progress-fill" [style.width.%]="progress()"></div></div>
      <span>{{ progress() }}%</span>
    </div>
  } @else {
    <label class="siu-dropzone">
      <i class="bi bi-cloud-arrow-up"></i>
      <span>Upload image</span>
      <input type="file" accept="image/jpeg,image/png,image/webp" hidden (change)="onFileSelected($event)" />
    </label>
  }

  @if (error()) { <span class="siu-err">{{ error() }}</span> }
</div>
