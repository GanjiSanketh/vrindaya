<div class="form-page">

  <div class="form-header">
    <div>
      <h1 class="form-title">{{ isEdit() ? 'Edit Expense' : 'New Expense' }}</h1>
      <p class="form-subtitle">{{ isEdit() ? 'Update the expense details below.' : 'Record a new business expense.' }}</p>
    </div>
    <a routerLink="/admin/expenses" class="btn-back"><i class="bi bi-arrow-left"></i> Back to Expenses</a>
  </div>

  @if (error()) {
    <div class="form-error"><i class="bi bi-exclamation-triangle-fill"></i> {{ error() }}</div>
  }

  @if (loading()) {
    <div class="form-loading"><span class="form-spinner"></span> Loading…</div>
  } @else {
    <div class="form-card">
      <div class="form-grid">
        <div class="field">
          <label class="field-label">Category *</label>
          <select class="field-input" [(ngModel)]="model.expenseCategory">
            <option value="">Select category…</option>
            @for (c of categories; track c) {
              <option [value]="c">{{ c }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label class="field-label">Type</label>
          <input class="field-input" type="text" [(ngModel)]="model.expenseType" placeholder="e.g. Google Ads, Courier" />
        </div>
        <div class="field">
          <label class="field-label">Vendor</label>
          <input class="field-input" type="text" [(ngModel)]="model.vendor" placeholder="Vendor name" />
        </div>
        <div class="field">
          <label class="field-label">Expense Date *</label>
          <input class="field-input" type="date" [(ngModel)]="model.expenseDate" />
        </div>
        <div class="field">
          <label class="field-label">Amount *</label>
          <input class="field-input" type="number" step="0.01" min="0" [(ngModel)]="model.amount" placeholder="0.00" />
        </div>
        <div class="field">
          <label class="field-label">GST</label>
          <input class="field-input" type="number" step="0.01" min="0" [(ngModel)]="model.gst" placeholder="0.00" />
        </div>
        <div class="field">
          <label class="field-label">Payment Method</label>
          <input class="field-input" type="text" [(ngModel)]="model.paymentMethod" placeholder="e.g. Bank Transfer, UPI, Cash" />
        </div>
        <div class="field">
          <label class="field-label">Reference Number</label>
          <input class="field-input" type="text" [(ngModel)]="model.referenceNumber" placeholder="UTRN or ref no." />
        </div>
        <div class="field">
          <label class="field-label">Invoice Number</label>
          <input class="field-input" type="text" [(ngModel)]="model.invoiceNumber" placeholder="Vendor invoice #" />
        </div>
        <div class="field">
          <label class="field-label">Payment Status</label>
          <select class="field-input" [(ngModel)]="model.paymentStatus">
            @for (s of paymentStatuses; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
        </div>
        <div class="field field-full">
          <label class="field-label">Description</label>
          <textarea class="field-input field-textarea" [(ngModel)]="model.description" placeholder="Brief description of the expense"></textarea>
        </div>
        <div class="field field-full">
          <label class="field-label">Notes</label>
          <textarea class="field-input field-textarea" [(ngModel)]="model.notes" placeholder="Additional notes (internal)"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-save" [disabled]="saving()" (click)="save()">
          {{ saving() ? 'Saving…' : (isEdit() ? 'Update Expense' : 'Record Expense') }}
        </button>
        <a routerLink="/admin/expenses" class="btn-cancel-link">Cancel</a>
      </div>
    </div>
  }

</div>
