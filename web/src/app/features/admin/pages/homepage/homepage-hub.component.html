<div class="hh-page">
  <h1 class="hh-title">Homepage Management</h1>
  <p class="hh-sub">Every section of the public homepage is managed here — no homepage content is hardcoded.</p>

  <div class="hh-grid">
    @for (card of cards; track card.title) {
      <a [routerLink]="card.link" class="hh-card">
        <div class="hh-icon"><i class="bi {{ card.icon }}"></i></div>
        <h2 class="hh-card-title">{{ card.title }}</h2>
        <p class="hh-card-desc">{{ card.desc }}</p>
      </a>
    }
  </div>
</div>
