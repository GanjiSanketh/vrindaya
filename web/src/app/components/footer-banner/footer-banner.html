@if (banner()?.imageUrl) {
  <section class="fb-section">
    <div class="fb-card">
      <img [src]="banner()!.imageUrl" [alt]="banner()!.title || banner()!.subtitle || ''" class="fb-img" loading="lazy" />
      <div class="fb-overlay">
        @if (banner()!.title) { <h3 class="fb-title">{{ banner()!.title }}</h3> }
        @if (banner()!.subtitle) { <p class="fb-subtitle">{{ banner()!.subtitle }}</p> }
        @if (banner()!.buttonText) {
          <a [href]="banner()!.buttonUrl || '#'" class="btn-primary fb-cta">
            {{ banner()!.buttonText }} <i class="bi bi-arrow-right"></i>
          </a>
        }
      </div>
    </div>
  </section>
}
