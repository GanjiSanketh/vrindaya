<section class="trending-section section-pad" id="best-sellers">
  <div class="container-vr">

    <div class="section-header" data-reveal>
      <p class="section-label">Customer favourites</p>
      <h2 class="section-title">Best Sellers</h2>
      <p class="section-desc">Loved again and again — our most-shopped styles.</p>
    </div>

    <div class="trending-grid">
      @for (p of products(); track p.id; let i = $index) {
        <app-product-card [product]="p" style="--stagger-delay: {{ i * 60 }}ms" />
      }
    </div>

    <div class="trending-cta">
      <a [routerLink]="['/shop']" [queryParams]="{ filter: 'bestSeller' }" class="btn-outline">
        View All Best Sellers <i class="bi bi-arrow-right"></i>
      </a>
    </div>

  </div>
</section>
