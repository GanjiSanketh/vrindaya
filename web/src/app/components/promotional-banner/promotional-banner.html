@if (banners().length > 0) {
  <section class="promo-section section-pad">
    <div class="container-vr promo-stack">
      @for (banner of banners(); track banner.id) {
        <div class="promo-card">
          <picture>
            @if (banner.mobileImageUrl) {
              <source media="(max-width: 767px)" [srcset]="banner.mobileImageUrl" />
            }
            <img [src]="banner.desktopImageUrl" [alt]="banner.buttonText || 'Promotional banner'" class="promo-img" loading="lazy" />
          </picture>

          @if (banner.buttonText) {
            <a [href]="banner.buttonUrl || '#'" class="btn-primary promo-cta">
              {{ banner.buttonText }} <i class="bi bi-arrow-right"></i>
            </a>
          }
        </div>
      }
    </div>
  </section>
}
