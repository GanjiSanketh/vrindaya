<section class="na-section section-pad" id="new-arrivals">
  <div class="container-vr">

    <div class="section-header" data-reveal>
      <p class="section-label">Fresh from the studio</p>
      <h2 class="section-title">New Arrivals</h2>
      <p class="section-desc">Fresh styles just in — discover the latest additions to our collection.</p>
    </div>

    <div class="na-grid">
      @for (p of preview(); track p.id; let i = $index) {
        <app-product-card [product]="p" style="--stagger-delay: {{ i * 60 }}ms" />
      }
    </div>

    <div class="na-cta">
      <a routerLink="/new-arrivals" class="btn-outline" (click)="onViewAll()">
        View All New Arrivals <i class="bi bi-arrow-right"></i>
      </a>
    </div>

  </div>
</section>
