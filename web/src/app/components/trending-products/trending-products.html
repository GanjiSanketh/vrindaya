<section class="trending-section section-pad" id="trending">
  <div class="container-vr">

    <div class="section-header" data-reveal>
      <p class="section-label">Most loved</p>
      <h2 class="section-title">Trending Collection</h2>
      <p class="section-desc">Curated ethnic styles designed to make every day elegant.</p>
    </div>

    <div class="trending-grid">
      @for (p of products(); track p.id; let i = $index) {
        <app-product-card [product]="p" style="--stagger-delay: {{ i * 60 }}ms" />
      }
    </div>

    <div class="trending-cta">
      <a routerLink="/trending" class="btn-outline" (click)="onViewAll()">
        View All Trending <i class="bi bi-arrow-right"></i>
      </a>
    </div>

  </div>
</section>
