<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vrindaya logo">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="#1b7a8a" stroke-width="5.5"/>
  <!-- Inner arc (double ring effect) -->
  <path d="M 24,128 A 78,78 0 1 1 176,128" fill="none" stroke="#1b7a8a" stroke-width="3" opacity="0.65"/>
  <!-- Bold V -->
  <path d="M40 56 L100 152 L160 56"
        fill="none" stroke="#1b7a8a" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round"/>
