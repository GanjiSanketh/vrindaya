  <path d="M107 117
           C 124 92, 156 64, 160 56
           C 165 82, 154 118, 126 136
           C 117 142, 107 138, 107 117Z"
        fill="#1b7a8a"/>
  <!-- Leaf veins -->
  <path d="M119 124 Q144 95 155 67"
        fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M127 132 Q148 108 155 82"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.38"/>
</svg>
