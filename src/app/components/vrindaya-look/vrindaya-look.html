<section class="vl-section section-pad-lg" id="vrindaya-look">
  <div class="container-vr">

    <!-- Header -->
    <div class="section-header vl-header">
      <svg class="lotus-icon" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg" width="40" height="32" aria-hidden="true">
        <path d="M20 4C20 4 11 11 11 20C11 25 14.8 29 20 29C25.2 29 29 25 29 20C29 11 20 4 20 4Z" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <path d="M20 10C13 8 7 12 6 18" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <path d="M20 10C27 8 33 12 34 18" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <circle cx="20" cy="25" r="3" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
      </svg>
      <h2 class="section-title">THE VRINDAYA LOOK</h2>
      <p class="section-script">Wear the Grace. Live the Elegance.</p>
      <div class="section-rule">
        <svg viewBox="0 0 20 16" xmlns="http://www.w3.org/2000/svg" width="18" height="14" aria-hidden="true">
          <circle cx="10" cy="10" r="3" fill="none" stroke="var(--gold)" stroke-width="1"/>
          <path d="M10 2C8 5 8 8 9 10" fill="none" stroke="var(--gold)" stroke-width="1"/>
          <path d="M10 2C12 5 12 8 11 10" fill="none" stroke="var(--gold)" stroke-width="1"/>
        </svg>
      </div>
      <p class="section-desc">Timeless styles, beautifully crafted for every moment of your life.</p>
    </div>

    <!-- Editorial masonry grid -->
    <div class="vl-grid">

      <!-- Featured card — spans all 3 rows on desktop -->
      @if (items[0]) {
        <a class="vl-card vl-card-featured"
           [routerLink]="['/category', items[0].categoryId]"
           [attr.aria-label]="'Explore ' + items[0].title">
          <img [src]="items[0].image" [alt]="items[0].title" class="vl-img" loading="lazy" />
          <div class="vl-overlay">
            <div class="vl-overlay-inner">
              <h3 class="vl-title">{{ items[0].title }}</h3>
              <p class="vl-sub">{{ items[0].subtitle }}</p>
              <span class="vl-cta">Explore <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
            </div>
          </div>
        </a>
      }

      <!-- Smaller cards -->
      @for (item of items.slice(1); track item.title) {
        <a class="vl-card"
           [routerLink]="['/category', item.categoryId]"
           [attr.aria-label]="'Explore ' + item.title">
          <img [src]="item.image" [alt]="item.title" class="vl-img" loading="lazy" />
          <div class="vl-overlay">
            <div class="vl-overlay-inner">
              <h3 class="vl-title vl-title-sm">{{ item.title }}</h3>
              <p class="vl-sub vl-sub-sm">{{ item.subtitle }}</p>
              <span class="vl-cta">Explore <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
            </div>
          </div>
        </a>
      }

    </div>

  </div>
</section>
