<section class="trust-bar" aria-label="Why choose Vrindaya">
  <div class="container-fluid trust-container">
    <div class="trust-grid">

      <div class="trust-item" appScrollReveal [srDelay]="0">
        <div class="trust-icon-wrap">
          <i class="bi bi-gem"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">Premium Fabrics</h4>
          <p class="trust-sub">Handpicked materials, exceptional quality</p>
        </div>
      </div>

      <div class="trust-rule"></div>

      <div class="trust-item" appScrollReveal [srDelay]="120">
        <div class="trust-icon-wrap">
          <i class="bi bi-award"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">Designer Curated</h4>
          <p class="trust-sub">Every piece thoughtfully handpicked</p>
        </div>
      </div>

      <div class="trust-rule"></div>

      <div class="trust-item" appScrollReveal [srDelay]="240">
        <div class="trust-icon-wrap">
          <i class="bi bi-people"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">Trusted by 20,000+</h4>
          <p class="trust-sub">Women across India love Vrindaya</p>
        </div>
      </div>

      <div class="trust-rule"></div>

      <div class="trust-item" appScrollReveal [srDelay]="360">
        <div class="trust-icon-wrap">
          <i class="bi bi-bag-plus"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">New Every Week</h4>
          <p class="trust-sub">Fresh collections added weekly</p>
        </div>
      </div>

    </div>
  </div>
</section>
