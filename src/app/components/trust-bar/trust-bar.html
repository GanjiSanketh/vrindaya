<section class="trust-bar" aria-label="The Vrindaya Promise">
  <div class="container-fluid trust-container">
    <div class="trust-grid">

      <div class="trust-item" appScrollReveal [srDelay]="0">
        <div class="trust-icon-wrap">
          <i class="bi bi-gem"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">Premium Fabrics</h4>
          <p class="trust-sub">Curated materials of exceptional craft</p>
        </div>
      </div>

      <div class="trust-rule"></div>

      <div class="trust-item" appScrollReveal [srDelay]="120">
        <div class="trust-icon-wrap">
          <i class="bi bi-award"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">Designer Curated</h4>
          <p class="trust-sub">Every piece handpicked for elegance</p>
        </div>
      </div>

      <div class="trust-rule"></div>

      <div class="trust-item" appScrollReveal [srDelay]="240">
        <div class="trust-icon-wrap">
          <i class="bi bi-people"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">Loved Across India</h4>
          <p class="trust-sub">A community of 20,000+ style-forward women</p>
        </div>
      </div>

      <div class="trust-rule"></div>

      <div class="trust-item" appScrollReveal [srDelay]="360">
        <div class="trust-icon-wrap">
          <i class="bi bi-calendar3"></i>
        </div>
        <div class="trust-text">
          <h4 class="trust-heading">Fresh Every Week</h4>
          <p class="trust-sub">New styles and editorial looks, weekly</p>
        </div>
      </div>

    </div>
  </div>
</section>
