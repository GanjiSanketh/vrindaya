<section class="hero" id="hero">

  <!-- Full-bleed background photo -->
  <div class="hero-bg">
    <img
      src="assets/products/004-pastel-stripe-kurta/image-1.png"
      alt="Vrindaya — Where Tradition Meets Modern Grace"
      class="hero-bg-img"
      priority
    />
    <div class="hero-bg-overlay"></div>
  </div>

  <!-- Glassmorphism card -->
  <div class="hero-card-side">
    <div class="hero-glass-card">

      <p class="hero-glass-label ha ha-1">TRADITIONAL INDIAN WOMEN'S WEAR</p>

      <h1 class="hero-glass-title">
        <span class="hgt-line ha ha-2">Where Tradition</span>
        <em class="hgt-em ha ha-3">Meets Modern Grace</em>
      </h1>

      <div class="hero-glass-rule ha ha-4"></div>

      <p class="hero-glass-desc ha ha-4">
        Graceful designs for the modern Indian woman — curated with love, crafted with tradition.
      </p>

      <div class="hero-glass-actions ha ha-5">
        <button class="hero-cta-dark" (click)="scrollToProducts()">
          EXPLORE COLLECTION
        </button>
        <button class="hero-cta-text" (click)="scrollToNew()">
          New Arrivals <i class="bi bi-arrow-right"></i>
        </button>
      </div>

      <!-- Pagination dots (decorative) -->
      <div class="hero-dots ha ha-6">
        <span class="hero-dot active"></span>
        <span class="hero-dot"></span>
        <span class="hero-dot"></span>
      </div>

    </div>
  </div>

</section>
