<section id="hero" class="hero-section">
  <!-- Decorative shapes -->
  <div class="hero-shape hero-shape-1"></div>
  <div class="hero-shape hero-shape-2"></div>
  <div class="hero-shape hero-shape-3"></div>

  <div class="container-fluid hero-container">
    <div class="row align-items-center hero-content-row">

      <!-- Left: Text Content -->
      <div class="col-12 col-lg-6 hero-text-col">
        <div class="hero-eyebrow animate-fade-up">
          <span class="eyebrow-dot"></span>
          New Season Collection 2025
        </div>

        <h1 class="hero-title animate-fade-up-delay-1">
          Wear the<br />
          <em>Art of</em><br />
          India
        </h1>

        <p class="hero-subtitle animate-fade-up-delay-2">
          Handcrafted ethnic wear that celebrates the richness of Indian artisanship.
          Discover kurtas, sarees, lehengas, and more — curated for the modern woman.
        </p>

        <div class="hero-ctas animate-fade-up-delay-3">
          <button class="btn-vrindaya btn-vrindaya-primary" (click)="scrollToProducts()">
            Explore Collection
            <i class="bi bi-arrow-right"></i>
          </button>
          <button class="btn-vrindaya btn-vrindaya-outline" (click)="scrollToNew()">
            New Arrivals
          </button>
        </div>

        <!-- Stats -->
        <div class="hero-stats animate-fade-up-delay-3">
          <div class="stat">
            <span class="stat-number">500+</span>
            <span class="stat-label">Products</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-number">20k+</span>
            <span class="stat-label">Happy Customers</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-number">50+</span>
            <span class="stat-label">Brands</span>
          </div>
        </div>
      </div>

      <!-- Right: Hero Visual -->
      <div class="col-12 col-lg-6 hero-visual-col d-none d-lg-flex">
        <div class="hero-visual">

          <!-- Main image card -->
          <div class="hero-card hero-card-main animate-fade-up-delay-1">
            <div class="hero-img-wrap">
              <img
                src="https://picsum.photos/seed/vrindaya-hero/500/650"
                alt="Featured fashion"
                class="hero-img"
                loading="eager"
              />
              <div class="hero-card-overlay">
                <span class="overlay-tag">Trending Now ✦</span>
              </div>
            </div>
          </div>

          <!-- Floating accent card -->
          <div class="hero-card hero-card-accent animate-fade-up-delay-2">
            <img
              src="https://picsum.photos/seed/vrindaya-hero2/280/360"
              alt="New arrival"
              class="hero-img"
              loading="eager"
            />
            <div class="accent-card-label">
              <span class="label-dot"></span>
              New Arrivals
            </div>
          </div>

          <!-- Floating badge -->
          <div class="hero-badge animate-fade-up-delay-3">
            <i class="bi bi-star-fill"></i>
            <div>
              <strong>4.8/5</strong>
              <span>Rating</span>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator">
    <div class="scroll-line"></div>
    <span>Scroll</span>
  </div>
</section>
