<section class="hero" id="hero">

  <!-- Warm editorial background panel (right side) -->
  <div class="hero-arch" aria-hidden="true"></div>

  <div class="hero-inner">

    <!-- ── LEFT: Editorial content ── -->
    <div class="hero-content">

      <h1 class="hero-title ha ha-1">
        Wear the
        <em class="hero-title-em">Grace</em>
      </h1>

      <p class="hero-desc ha ha-2">
        Timeless ethnic wear crafted for women who embrace elegance every day.
      </p>

      <div class="hero-actions ha ha-3">
        <button class="hbtn-primary" (click)="scrollToProducts()">
          Explore Collection
        </button>
        <button class="hbtn-ghost" (click)="scrollToNew()">
          New Arrivals <i class="bi bi-arrow-right"></i>
        </button>
      </div>

    </div>

    <!-- ── RIGHT: Hero image ── -->
    <div class="hero-img-col">
      <div class="hero-img-wrap ha ha-1">
        <img
          src="assets/hero/hero-banner.png"
          alt="Vrindaya — Wear the Grace"
          class="hero-product-img"
        />
      </div>
    </div>

  </div>

</section>
