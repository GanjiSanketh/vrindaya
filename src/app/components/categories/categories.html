<section id="categories" class="categories-section">
  <div class="container-fluid categories-container">

    <!-- Editorial header -->
    <div class="categories-header">
      <div class="cat-header-left">
        <div class="cat-eyebrow">
          <span class="cat-eyebrow-line"></span>
          <span class="cat-eyebrow-text">Browse</span>
        </div>
        <h2 class="cat-title">Shop by<br>Category</h2>
      </div>
      <div class="cat-header-right">
        <span class="cat-num">00</span>
        <p class="cat-desc">Curated collections<br>for every occasion.</p>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="categories-scroll-wrapper">
      <div class="categories-row">
        @for (cat of categories; track cat.id) {
          <button
            class="category-chip"
            [class.active]="selectedCategory() === cat.id"
            (click)="selectCategory(cat.id)"
          >
            <span class="chip-icon">{{ cat.icon }}</span>
            <span>{{ cat.name }}</span>
          </button>
        }
      </div>
    </div>

    <!-- Category Cards -->
    <div class="category-cards-row">
      @for (cat of categories.slice(1); track cat.id) {
        <div class="category-card" (click)="selectCategory(cat.id)" role="button">
          <div class="category-card-img-wrap">
            <img [src]="cat.image" [alt]="cat.name" class="category-card-img" loading="lazy" />
            <div class="category-card-overlay"></div>
          </div>
          <div class="category-card-body">
            <span class="category-card-icon">{{ cat.icon }}</span>
            <h3 class="category-card-name">{{ cat.name }}</h3>
            <span class="category-card-cta">Shop Now <i class="bi bi-arrow-right"></i></span>
          </div>
        </div>
      }
    </div>

  </div>
</section>
