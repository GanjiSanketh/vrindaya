<section class="cat-section section-pad" id="categories">
  <div class="container-vr">

    <!-- Header -->
    <div class="section-header">
      <svg class="lotus-icon" viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg" width="40" height="32">
        <path d="M20 4C20 4 11 11 11 20C11 25 14.8 29 20 29C25.2 29 29 25 29 20C29 11 20 4 20 4Z" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <path d="M20 10C13 8 7 12 6 18" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <path d="M20 10C27 8 33 12 34 18" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <path d="M20 14C9 12 3 19 2 25" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <path d="M20 14C31 12 37 19 38 25" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <circle cx="20" cy="25" r="3" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
      </svg>
      <!-- <p class="section-label">SHOP BY STYLE</p> -->
      <h2 class="section-title">Shop by Category</h2>
      <div class="section-rule">
        <svg viewBox="0 0 20 16" xmlns="http://www.w3.org/2000/svg" width="18" height="14">
          <circle cx="10" cy="10" r="3" fill="none" stroke="var(--gold)" stroke-width="1"/>
          <path d="M10 2C8 5 8 8 9 10" fill="none" stroke="var(--gold)" stroke-width="1"/>
          <path d="M10 2C12 5 12 8 11 10" fill="none" stroke="var(--gold)" stroke-width="1"/>
        </svg>
      </div>
      <p class="section-desc">Curated collections for every mood and every occasion</p>
    </div>

    <!-- Category grid -->
    <div class="cat-grid">
      @for (cat of categories; track cat.id) {
        <div class="cat-card" (click)="selectAndScroll(cat.id)" role="button" [attr.aria-label]="cat.name">
          <div class="cat-img-wrap">
            <img [src]="cat.image" [alt]="cat.name" class="cat-img" loading="lazy" />
            <div class="cat-overlay"></div>
          </div>
          <div class="cat-info">
            <h3 class="cat-name">{{ cat.name }}</h3>
            <p class="cat-sub">{{ cat.subtitle }}</p>
            <span class="cat-cta">Explore Collection <i class="bi bi-arrow-right"></i></span>
          </div>
        </div>
      }
    </div>

  </div>
</section>
