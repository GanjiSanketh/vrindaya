<section id="categories" class="cat-section">
  <div class="container-fluid cat-container">

    <!-- Header -->
    <div class="cat-header">
      <div>
        <p class="cat-eyebrow">Browse Our Range</p>
        <h2 class="cat-title">Shop by Category</h2>
      </div>
      <button class="cat-view-all" (click)="selectCategory('All')">
        View All <i class="bi bi-arrow-right"></i>
      </button>
    </div>

    <!-- Filter chips (compact, for quick filtering) -->
    <div class="cat-chips-row">
      @for (cat of categories; track cat.id) {
        <button
          class="cat-chip"
          [class.active]="selectedCategory() === cat.id"
          (click)="selectCategory(cat.id)"
        >{{ cat.icon }} {{ cat.label }}</button>
      }
    </div>

    <!-- Color card grid -->
    <div class="cat-color-grid">
      @for (cat of categories.slice(1); track cat.id; let i = $index) {
        <div
          class="cat-color-card"
          [style.background]="cat.bgColor"
          (click)="selectCategory(cat.id)"
          role="button"
          [attr.aria-label]="'Browse ' + cat.label"
        >
          <div class="cat-card-inner">
            <div class="cat-icon-circle" [style.background]="cat.iconBg">
              <i class="bi" [class]="'bi-' + cat.biIcon"></i>
            </div>
            <h3 class="cat-card-name">{{ cat.label }}</h3>
            <span class="cat-card-cta">Explore Now <i class="bi bi-arrow-right"></i></span>
          </div>
          <div class="cat-card-img-wrap">
            <img [src]="cat.image" [alt]="cat.label" class="cat-card-img" loading="lazy" />
          </div>
        </div>
      }
    </div>

  </div>
</section>
