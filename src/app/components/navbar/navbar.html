<!-- Sticky Navbar -->
<header class="vr-nav" [class.scrolled]="scrolled()">
  <div class="nav-inner">

    <!-- LEFT nav links (desktop) -->
    <nav class="nav-left d-none d-xl-flex">
      <a class="nav-link" (click)="scrollTo('hero')" role="button">Home</a>
      <a class="nav-link" (click)="selectCategory('long-kurtas')" role="button">Long Kurtas</a>
      <a class="nav-link" (click)="selectCategory('short-kurtas')" role="button">Short Kurtas</a>
      <a class="nav-link" (click)="selectCategory('2-piece-sets')" role="button">2-Piece Sets</a>
      <a class="nav-link" (click)="selectCategory('3-piece-sets')" role="button">3-Piece Sets</a>
    </nav>

    <!-- Mobile: hamburger -->
    <button class="hamburger d-xl-none" (click)="toggleMenu()" aria-label="Menu">
      <span [class.open]="mobileMenuOpen()"></span>
      <span [class.open]="mobileMenuOpen()"></span>
      <span [class.open]="mobileMenuOpen()"></span>
    </button>

    <!-- CENTER: logo -->
    <a class="nav-logo" (click)="scrollTo('hero')" role="button" aria-label="Vrindaya Home">
      <img src="assets/logo/vrindaya-logo.png" alt="Vrindaya" class="logo-img" />
      <span class="logo-sub">— WOMEN —</span>
    </a>

    <!-- RIGHT nav (desktop) -->
    <div class="nav-right d-none d-xl-flex">
      <button class="nav-icon" (click)="toggleSearch()" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
      <button class="nav-icon" aria-label="Wishlist">
        <i class="bi bi-heart"></i>
      </button>
      <a class="nav-icon" href="https://instagram.com/vrindaya" target="_blank" rel="noopener" aria-label="Instagram">
        <i class="bi bi-instagram"></i>
      </a>
    </div>

    <!-- Mobile right icons -->
    <div class="nav-right d-flex d-xl-none">
      <button class="nav-icon" (click)="toggleSearch()" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
    </div>

  </div>

  <!-- Search bar -->
  @if (searchOpen()) {
    <div class="search-bar">
      <div class="search-inner">
        <i class="bi bi-search"></i>
        <input type="text" [(ngModel)]="searchQuery" (keydown.enter)="onSearch()"
               placeholder="Search kurtas, sets, styles..." class="search-input" autofocus />
        @if (searchQuery) {
          <button (click)="searchQuery = ''; productService.setSearch('')" class="search-clear">
            <i class="bi bi-x"></i>
          </button>
        }
      </div>
    </div>
  }

  <!-- Mobile drawer -->
  @if (mobileMenuOpen()) {
    <nav class="mobile-drawer">
      <a class="drawer-link" (click)="scrollTo('hero')" role="button">Home</a>
      <a class="drawer-link" (click)="scrollTo('trending')" role="button">Trending</a>
      <a class="drawer-link" (click)="scrollTo('new-arrivals')" role="button">New Arrivals</a>
      <div class="drawer-divider"></div>
      <p class="drawer-cat-label">Shop by Style</p>
      <a class="drawer-link" (click)="selectCategory('long-kurtas')" role="button">Long Kurtas</a>
      <a class="drawer-link" (click)="selectCategory('short-kurtas')" role="button">Short Kurtas</a>
      <a class="drawer-link" (click)="selectCategory('2-piece-sets')" role="button">2-Piece Sets</a>
      <a class="drawer-link" (click)="selectCategory('3-piece-sets')" role="button">3-Piece Sets</a>
    </nav>
  }
</header>
