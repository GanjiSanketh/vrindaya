<section class="hero" id="hero">

  <!-- LEFT: text content -->
  <div class="hero-content">
    <div class="hero-eyebrow">
      <span class="hero-brand-label">VRINDAYA</span>
      <svg class="hero-lotus" viewBox="0 0 36 28" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 3C18 3 10 10 10 18C10 23 13.6 26 18 26C22.4 26 26 23 26 18C26 10 18 3 18 3Z" fill="none" stroke="var(--gold)" stroke-width="1.1"/>
        <path d="M18 9C12 7 7 10 6 16" fill="none" stroke="var(--gold)" stroke-width="1.1"/>
        <path d="M18 9C24 7 29 10 30 16" fill="none" stroke="var(--gold)" stroke-width="1.1"/>
        <circle cx="18" cy="22" r="2.5" fill="none" stroke="var(--gold)" stroke-width="1.1"/>
      </svg>
    </div>

    <h1 class="hero-title">
      <span class="hero-line1">Wear the</span>
      <em class="hero-script">Grace
        <svg class="hero-leaf" viewBox="0 0 24 14" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 12 C6 4 14 1 22 3 C18 9 10 13 2 12Z" fill="none" stroke="var(--gold)" stroke-width="1"/>
          <path d="M12 7 C16 5 20 4 22 3" fill="none" stroke="var(--gold)" stroke-width="0.8"/>
        </svg>
      </em>
    </h1>

    <div class="hero-rule-wrap">
      <span class="rule-line"></span>
      <svg viewBox="0 0 20 16" xmlns="http://www.w3.org/2000/svg" width="20" height="16">
        <circle cx="10" cy="10" r="3.5" fill="none" stroke="var(--gold)" stroke-width="1"/>
        <path d="M10 2C8 5 8 8 9 10" fill="none" stroke="var(--gold)" stroke-width="1"/>
        <path d="M10 2C12 5 12 8 11 10" fill="none" stroke="var(--gold)" stroke-width="1"/>
      </svg>
      <span class="rule-line"></span>
    </div>

    <p class="hero-desc">
      Timeless ethnic wear crafted for women who embrace elegance every day.
    </p>

    <div class="hero-ctas">
      <button class="btn-primary" (click)="scrollTo('categories')">
        Explore Collection <i class="bi bi-arrow-right"></i>
      </button>
      <button class="btn-outline" (click)="scrollTo('new-arrivals')">
        New Arrivals
      </button>
    </div>

    <!-- Trust strip -->
    <div class="hero-trust">
      <div class="trust-pill">
        <i class="bi bi-flower1"></i>
        <span>Premium Fabrics</span>
      </div>
      <div class="trust-pill">
        <i class="bi bi-person-dress"></i>
        <span>Handpicked Designs</span>
      </div>
      <div class="trust-pill">
        <i class="bi bi-people"></i>
        <span>Trusted by Women</span>
      </div>
      <div class="trust-pill">
        <i class="bi bi-truck"></i>
        <span>Pan India Delivery</span>
      </div>
    </div>
  </div>

  <!-- RIGHT: model photo -->
  <div class="hero-visual">
    <img src="assets/hero/hero-banner.png" alt="Vrindaya — Wear the Grace" class="hero-img" />
  </div>

</section>
