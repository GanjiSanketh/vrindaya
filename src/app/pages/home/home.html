<app-navbar />

<main>

  <!-- Hero — full photo + glassmorphism card -->
  <app-hero-banner />

  <!-- Trust bar -->
  <app-trust-bar />

  <!-- Shop Our Favorites (trending) -->
  <section id="trending" class="home-section">
    <div class="container-fluid home-container">
      <div class="home-section-header">
        <h2 class="home-section-title">Shop Our Favorites</h2>
        <button class="home-view-all" (click)="scrollToSection('products')">
          VIEW ALL <i class="bi bi-arrow-right"></i>
        </button>
      </div>
      <app-product-grid filter="trending" />
    </div>
  </section>

  <!-- Category Color Grid -->
  <app-categories />

  <!-- New Arrivals -->
  <section id="new-arrivals" class="home-section home-section-warm">
    <div class="container-fluid home-container">
      <div class="home-section-header">
        <div>
          <p class="home-eyebrow">Just Dropped</p>
          <h2 class="home-section-title">New Arrivals</h2>
        </div>
        <button class="home-view-all" (click)="scrollToSection('products')">
          VIEW ALL <i class="bi bi-arrow-right"></i>
        </button>
      </div>
      <app-product-grid filter="new" />
    </div>
  </section>

  <!-- Brand Story -->
  <app-brand-story />

  <!-- Community Showcase — The Vrindaya Look -->
  <app-community-showcase />

  <!-- Discover All Styles -->
  <section id="products" class="home-section">
    <div class="container-fluid home-container">
      <div class="home-section-header">
        <div>
          <p class="home-eyebrow">The Full Edit</p>
          <h2 class="home-section-title">Discover All Styles</h2>
        </div>
      </div>
      <app-product-grid filter="all" />
    </div>
  </section>

</main>

<app-footer />

<!-- WhatsApp -->
<a href="https://wa.me/919999999999" class="floating-btn whatsapp-btn"
   target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
  <i class="bi bi-whatsapp"></i>
</a>

<!-- Scroll to top -->
<button class="floating-btn scroll-top-btn"
        [class.visible]="showScrollTop()"
        (click)="scrollToTop()"
        aria-label="Back to top">
  <i class="bi bi-arrow-up"></i>
</button>
