<app-navbar />

<main class="pl-page">

  <!-- Breadcrumb + Sort row -->
  <nav class="pl-breadcrumb" aria-label="Breadcrumb">
    <div class="container-vr pl-bc-inner">

      <div class="pl-bc-path">
        <a routerLink="/" class="pl-bc-link">Home</a>
        <i class="bi bi-chevron-right pl-bc-sep" aria-hidden="true"></i>
        <span class="pl-bc-current">Trending Collection</span>
      </div>

      <select
        class="pl-sort-select"
        (change)="setSort($event)"
        aria-label="Sort products"
      >
        <option value="popularity">Sort: Popularity</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>

    </div>
  </nav>

  <!-- Products -->
  <section class="pl-products">
    <div class="container-vr">

      @if (products().length > 0) {
        <div class="pl-grid">
          @for (product of products(); track product.id) {
            <app-product-card [product]="product" />
          }
        </div>
      } @else {
        <div class="pl-empty">
          <i class="bi bi-bag-x" aria-hidden="true"></i>
          <p class="pl-empty-title">No trending products at the moment</p>
          <p class="pl-empty-sub">Our curated picks are on their way — check back soon.</p>
          <a routerLink="/" class="btn-primary">Back to Home</a>
        </div>
      }

    </div>
  </section>

</main>

<app-footer />
