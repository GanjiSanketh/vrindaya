
<main class="pl-page">

  <!-- Breadcrumb + Sort row -->
  <nav class="pl-breadcrumb" aria-label="Breadcrumb">
    <div class="container-vr pl-bc-inner">

      <div class="pl-bc-path">
        <a routerLink="/" class="pl-bc-link">Home</a>
        <i class="bi bi-chevron-right pl-bc-sep" aria-hidden="true"></i>
        <span class="pl-bc-current">{{ category()?.name }}</span>
      </div>

      <select
        class="pl-sort-select"
        (change)="setSort($event)"
        aria-label="Sort products"
      >
        <option value="default">Sort: Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating">Top Rated</option>
      </select>

    </div>
  </nav>

  <!-- Products -->
  <section class="pl-products">
    <div class="container-vr">

      @defer (on timer(100); prefetch on immediate) {
        @if (products().length > 0) {
          <div class="pl-grid">
            @for (product of products(); track product.id) {
              <app-product-card [product]="product" />
            }
          </div>
        } @else {
          <div class="pl-empty">
            <i class="bi bi-bag-x" aria-hidden="true"></i>
            <p class="pl-empty-title">No products yet in this category</p>
            <p class="pl-empty-sub">New styles are on their way — check back soon.</p>
            <a routerLink="/" class="btn-primary">Back to Home</a>
          </div>
        }
      } @placeholder (minimum 400ms) {
        <app-skeleton-grid [count]="8" />
      }

    </div>
  </section>

</main>
