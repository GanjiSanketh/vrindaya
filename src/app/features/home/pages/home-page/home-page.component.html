<main>
  <app-hero />
  <app-new-arrivals-banner />
  <app-categories />
  <app-new-arrivals />
  <app-customer-love />
</main>

<!-- Instagram floating button -->
<a [href]="instagramUrl" class="floating-btn instagram-btn"
   target="_blank" rel="noopener noreferrer" aria-label="Follow us on Instagram">
  <i class="bi bi-instagram"></i>
</a>

<!-- Scroll to top -->
<button class="floating-btn scroll-top-btn" [class.visible]="showScrollTop()"
        (click)="scrollToTop()" aria-label="Back to top">
  <i class="bi bi-arrow-up"></i>
</button>
