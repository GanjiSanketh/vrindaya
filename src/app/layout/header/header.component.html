<!-- Sticky Navbar -->
<header class="vr-nav" [class.scrolled]="scrolled()">
  <div class="nav-inner">

    <!-- LEFT: desktop nav links -->
    <nav class="nav-left d-none d-xl-flex" aria-label="Main navigation">

      <a class="nav-link"
         routerLink="/"
         routerLinkActive="nav-link-active"
         [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>

      @for (cat of categories; track cat.id) {
        <a class="nav-link"
           [routerLink]="['/category', cat.id]"
           routerLinkActive="nav-link-active">
          {{ cat.name }}
        </a>
      }

    </nav>

    <!-- Mobile: hamburger -->
    <button class="hamburger d-xl-none"
            (click)="toggleMenu()"
            [attr.aria-expanded]="mobileMenuOpen()"
            aria-label="Toggle menu">
      <span [class.open]="mobileMenuOpen()"></span>
      <span [class.open]="mobileMenuOpen()"></span>
      <span [class.open]="mobileMenuOpen()"></span>
    </button>

    <!-- CENTER: logo -->
    <a class="nav-logo" routerLink="/" aria-label="Vrindaya — go to home">
      <img src="assets/logo/vrindaya-logo.png" alt="Vrindaya" class="logo-icon" draggable="false" />
      <span class="logo-brand">VRINDAYA</span>
      <span class="logo-tagline">WEAR THE GRACE</span>
    </a>

    <!-- RIGHT: Instagram link -->
    <div class="nav-right d-none d-xl-flex">
      <a class="nav-icon"
         href="https://www.instagram.com/vrindaya.co"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Follow us on Instagram">
        <i class="bi bi-instagram"></i>
      </a>
    </div>

  </div>

  <!-- Mobile drawer -->
  @if (mobileMenuOpen()) {
    <nav class="mobile-drawer" aria-label="Mobile menu">

      <a class="drawer-link"
         routerLink="/"
         routerLinkActive="drawer-link-active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeMenu()">
        Home
      </a>

      <div class="drawer-divider"></div>
      <p class="drawer-cat-label">Shop by Style</p>

      @for (cat of categories; track cat.id) {
        <a class="drawer-link"
           [routerLink]="['/category', cat.id]"
           routerLinkActive="drawer-link-active"
           (click)="closeMenu()">
          {{ cat.name }}
        </a>
      }

    </nav>
  }

</header>
